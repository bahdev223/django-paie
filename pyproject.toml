[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-paie"
version = "0.2.0"
description = "Application de paie modulaire pour Django - Mode SIMPLE (PME) et mode COMPLET (grandes entreprises)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sahel Comptabilite Team"},
]
keywords = ["django", "paie", "payroll", "mali", "xof", "salaire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "Django>=4.2",
    "reportlab",
    "openpyxl",
]

[project.urls]
Homepage = "https://github.com/bahdev223/django-paie"
Repository = "https://github.com/bahdev223/django-paie.git"

[tool.setuptools.packages.find]
include = ["django_paie*"]

[tool.setuptools.package-data]
django_paie = [
    "templates/**/*.html",
    "migrations/*.py",
]
